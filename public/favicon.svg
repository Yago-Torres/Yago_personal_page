<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Sol dibujado a mano">
  <style>
    /* La silueta es ámbar y se lee sobre cualquier fondo. La tinta solo
       decora el disco, así que puede perderse sin que el icono se caiga.
       Aun así se invierte con el tema del sistema, que ayuda casi siempre. */
    :root { --tinta: #17150f; }
    @media (prefers-color-scheme: dark) { :root { --tinta: #fdf6e8; } }
  </style>

  <!-- el relleno va un pelín corrido respecto al contorno, como al pintar a mano -->
  <path
    d="M33.2 16.8c9.3.2 16.9 7.3 16.6 16.8-.3 9.5-7.6 16.6-17 16.3-9.4-.3-16.3-7.4-16-16.9.3-9.2 7.4-16.4 16.4-16.2Z"
    fill="#f7b731" />

  <!-- los rayos van en ámbar: son los que sostienen la forma -->
  <g fill="none" stroke="#f0a81f" stroke-linecap="round">
    <g stroke-width="4">
      <path d="M32.2 11c-.1-2.3-.3-4.5-.6-6.8" />
      <path d="M53 32.8c2.2-.1 4.4-.3 6.7-.6" />
      <path d="M31.8 54c.1 2.2.2 4.4.5 6.6" />
      <path d="M11 32.2c-2.2.1-4.5.2-6.7.5" />
    </g>
    <g stroke-width="3.6">
      <path d="M46.7 17.8c1.6-1.6 3.2-3.2 4.7-4.9" />
      <path d="M47 46.9c1.6 1.5 3.2 3.1 4.8 4.7" />
      <path d="M17.1 47.2c-1.6 1.5-3.3 3.1-4.9 4.8" />
      <path d="M17.4 18.1c-1.5-1.7-3.1-3.3-4.8-5" />
    </g>
  </g>

  <!-- el contorno del disco: cuatro trazos que no cierran del todo igual -->
  <path
    d="M32 15c9.6-.4 17.8 7.2 17.5 17.4-.3 10.2-7.9 18-17.9 17.6-10-.4-17.3-8.2-17-18.4C14.9 21.9 22.4 15.4 32 15Z"
    fill="none"
    stroke="var(--tinta)"
    stroke-width="3.5"
    stroke-linecap="round"
    stroke-linejoin="round" />
</svg>
