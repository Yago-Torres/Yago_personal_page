<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>YTG-01 · consola de cultivo</title>
    <meta name="description" content="Un jardín donde las plantas son mi carrera. Yago Torres, yagotg.dev" />
    <style>
      :root {
        --tipo: ui-monospace, "Cascadia Mono", Menlo, Consolas, monospace;
        --tinta: #3f3a2f;
        --pantalla: #141f1a;
        --fosforo: #cfe8c4;
        --coral: #ff6b4a;
        color-scheme: light;
      }
      * { box-sizing: border-box; }
      body { margin: 0; overflow: hidden; background: #bfe6f0; font-family: var(--tipo); }
      #lienzo { display: block; width: 100vw; height: 100dvh; }

      /* ─── rótulo y lecturas ─── */

      .rotulo {
        position: fixed;
        top: 20px;
        left: 24px;
        font-size: 10px;
        letter-spacing: .16em;
        text-transform: uppercase;
        color: var(--tinta);
        pointer-events: none;
        text-shadow: 0 1px 2px #ffffff80;
      }
      .rotulo b { display: block; font-size: 15px; letter-spacing: -.01em; text-transform: none; }

      .lecturas {
        position: fixed;
        top: 20px;
        right: 24px;
        display: flex;
        gap: 18px;
        font-size: 10px;
        letter-spacing: .12em;
        text-transform: uppercase;
        color: var(--tinta);
        pointer-events: none;
        text-shadow: 0 1px 2px #ffffff80;
      }
      .lecturas div { display: grid; gap: 3px; justify-items: end; }
      .lecturas b { font-size: 14px; letter-spacing: -.01em; font-variant-numeric: tabular-nums; }
      .lecturas span { opacity: .6; }

      /* ─── etiqueta flotante ─── */

      #pista {
        position: fixed;
        left: 50%;
        bottom: 28px;
        translate: -50% 0;
        padding: 7px 14px;
        border-radius: 999px;
        background: #2a2620e6;
        color: #f6f1e4;
        font-size: 11px;
        letter-spacing: .1em;
        text-transform: uppercase;
        opacity: 0;
        transition: opacity .18s;
        pointer-events: none;
      }
      #pista.visible { opacity: 1; }

      /* ─── ficha ─── */

      #ficha {
        position: fixed;
        right: 5vw;
        top: 50%;
        translate: 0 -50%;
        width: min(360px, 42vw);
        max-height: 74vh;
        overflow-y: auto;
        display: grid;
        gap: 12px;
        align-content: start;
        padding: 22px;
        border-radius: 14px;
        background: #141f1af2;
        color: var(--fosforo);
        font-size: 13px;
        line-height: 1.6;
        opacity: 0;
        transition: opacity .28s;
        pointer-events: none;
      }
      #ficha.visible { opacity: 1; pointer-events: auto; }
      #ficha h2 {
        margin: 0;
        font-size: 11px;
        letter-spacing: .14em;
        text-transform: uppercase;
        opacity: .55;
        font-weight: 600;
      }
      #ficha-cuerpo { display: grid; gap: 9px; }
      #ficha p { margin: 0; }
      #ficha b { color: #ffbfa6; font-weight: 600; }

      /* ─── consola ─── */

      #consola {
        display: grid;
        gap: 8px;
        padding-top: 12px;
        border-top: 1px solid #cfe8c426;
      }
      #consola-log {
        display: grid;
        gap: 4px;
        max-height: 30vh;
        overflow-y: auto;
        font-size: 12px;
        line-height: 1.55;
        opacity: .82;
      }
      #consola-log .eco { color: #ffbfa6; opacity: .7; }
      #consola .linea { display: flex; gap: 9px; align-items: center; }
      #consola .prompt { color: #ffbfa6; }
      #entrada {
        flex: 1;
        border: 0;
        padding: 0;
        background: none;
        color: inherit;
        font: inherit;
      }
      #entrada:focus { outline: none; }
      #entrada::placeholder { color: #cfe8c440; }

      .boton {
        justify-self: start;
        border: 0;
        cursor: pointer;
        padding: 8px 16px;
        border-radius: 999px;
        background: var(--coral);
        color: #fff;
        font-family: var(--tipo);
        font-size: 10px;
        letter-spacing: .12em;
        text-transform: uppercase;
      }

      /* ─── ajustes ─── */

      #abrir-ajustes {
        position: fixed;
        right: 20px;
        bottom: 20px;
        border: 0;
        cursor: pointer;
        padding: 10px 18px;
        border-radius: 999px;
        background: #2a2620;
        color: #f6f1e4;
        font-family: var(--tipo);
        font-size: 10px;
        letter-spacing: .12em;
        text-transform: uppercase;
      }
      #ajustes {
        position: fixed;
        right: 20px;
        bottom: 66px;
        display: none;
        gap: 10px;
        padding: 16px;
        border-radius: 12px;
        background: #fffefbe6;
        backdrop-filter: blur(8px);
        box-shadow: 0 8px 28px #0000002b;
        font-size: 10px;
        letter-spacing: .1em;
        text-transform: uppercase;
        color: var(--tinta);
      }
      #ajustes.abierto { display: grid; }
      #mandos { display: grid; gap: 9px; }
      #mandos label {
        display: grid;
        grid-template-columns: 120px 130px 32px;
        align-items: center;
        gap: 10px;
      }
      #mandos output { text-align: right; font-variant-numeric: tabular-nums; }
      #mandos input { width: 100%; }

      @media (max-width: 720px) {
        #ficha { right: 4vw; left: 4vw; width: auto; top: auto; bottom: 86px; translate: 0; max-height: 46vh; }
        #ajustes { left: 20px; }
        #mandos label { grid-template-columns: 1fr 1fr 30px; }
        .lecturas { gap: 12px; }
      }
    </style>
  </head>
  <body>
    <canvas id="lienzo"></canvas>

    <div class="rotulo">
      <b>YTG-01</b>
      consola de cultivo · zaragoza
    </div>

    <div class="lecturas">
      <div><b id="lectura-hora">--:--</b><span>hora</span></div>
      <div><b id="lectura-temperatura">--º</b><span>exterior</span></div>
      <div><b id="lectura-meteo">—</b><span>cielo</span></div>
      <div><b id="lectura-estacion">—</b><span>estación</span></div>
    </div>

    <div id="pista"></div>

    <div id="ficha">
      <h2 id="ficha-titulo">consola de riego</h2>
      <div id="ficha-cuerpo"></div>

      <div id="consola">
        <div id="consola-log" aria-live="polite"></div>
        <div class="linea">
          <span class="prompt" aria-hidden="true">&gt;</span>
          <input
            id="entrada"
            type="text"
            autocomplete="off"
            autocapitalize="off"
            spellcheck="false"
            aria-label="consola de riego"
            placeholder="ayuda" />
        </div>
      </div>

      <button class="boton" id="volver" type="button">salir · esc</button>
    </div>

    <button id="abrir-ajustes" type="button">ajustes</button>
    <div id="ajustes"><div id="mandos"></div></div>

    <script type="module" src="/src/prototipo/main.ts"></script>
  </body>
</html>
