<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>YTG-01 · consola de cultivo</title>
    <meta name="description" content="Un jardín donde las plantas son mi carrera. Yago Torres, yagotg.dev" />
    <style>
      :root {
        --tipo: ui-monospace, "Cascadia Mono", Menlo, Consolas, monospace;
        --chapa: #f4efe2;
        --tinta: #2e2a21;
        --tinta-floja: #7d7666;
        --surco: #cdc5b2;
        --pantalla: #0f1a15;
        --fosforo: #d5ecc9;
        --fosforo-flojo: #d5ecc980;
        --coral: #ff6b4a;
        --u: 6px;              /* unidad de la pantalla, la fija el motor */
        color-scheme: light;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        overflow: hidden;
        background: #bfe6f0;
        font-family: var(--tipo);
        -webkit-font-smoothing: antialiased;
      }
      #lienzo { display: block; width: 100vw; height: 100dvh; }

      /* ─── chapa de datos: placa sólida, nada de texto flotando ─── */

      .chapa {
        position: fixed;
        top: 18px;
        left: 18px;
        right: 18px;
        display: flex;
        align-items: stretch;
        justify-content: space-between;
        gap: 2px;
        background: var(--surco);
        border-radius: 10px;
        overflow: hidden;
        box-shadow: 0 2px 0 #00000014, 0 10px 24px #0000001f;
        pointer-events: none;
      }
      .chapa__marca,
      .chapa__dato {
        background: var(--chapa);
        padding: 9px 14px;
        display: grid;
        gap: 1px;
        align-content: center;
      }
      .chapa__marca { flex: 1; }
      .chapa__modelo { font-size: 15px; font-weight: 700; letter-spacing: -.02em; color: var(--tinta); }
      .chapa__dato { min-width: 78px; text-align: right; }
      .chapa b {
        font-size: 15px;
        font-weight: 700;
        letter-spacing: -.01em;
        color: var(--tinta);
        font-variant-numeric: tabular-nums;
        font-feature-settings: "tnum" 1;
      }
      .chapa span {
        font-size: 8px;
        letter-spacing: .16em;
        text-transform: uppercase;
        color: var(--tinta-floja);
      }

      /* ─── etiqueta flotante ─── */

      #pista {
        position: fixed;
        left: 50%;
        bottom: 26px;
        translate: -50% 0;
        padding: 7px 15px;
        border-radius: 999px;
        background: #2a2620e6;
        color: #f6f1e4;
        font-size: 11px;
        letter-spacing: .1em;
        text-transform: uppercase;
        opacity: 0;
        transition: opacity .18s;
        pointer-events: none;
      }
      #pista.visible { opacity: 1; }

      /* ─── el visor: se coloca justo encima de la pantalla del aparato ─── */

      #visor {
        position: fixed;
        display: none;
        overflow: hidden;
        border-radius: 6px;
        background: var(--pantalla);
        color: var(--fosforo);
        opacity: 0;
        transition: opacity .25s;
      }
      #visor.montado { display: grid; }
      #visor.visible { opacity: 1; }

      #visor-interior {
        display: grid;
        grid-template-rows: auto 1fr auto auto;
        height: 100%;
        min-height: 0;
        font-size: calc(var(--u) * 2.1);
        line-height: 1.5;
      }

      .pz-cabecera {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: var(--u);
        padding: calc(var(--u) * 1.6) calc(var(--u) * 2.2);
        border-bottom: 1px solid #d5ecc91f;
      }
      .pz-titulo {
        font-size: calc(var(--u) * 2.4);
        letter-spacing: .12em;
        text-transform: uppercase;
      }
      .pz-reloj {
        font-size: calc(var(--u) * 2);
        color: var(--fosforo-flojo);
        font-variant-numeric: tabular-nums;
      }

      .pz-cuerpo {
        overflow-y: auto;
        padding: calc(var(--u) * 1.2) calc(var(--u) * 1.6);
        display: grid;
        gap: calc(var(--u) * 0.5);
        align-content: start;
      }
      .pz-cuerpo::-webkit-scrollbar { width: calc(var(--u) * 0.8); }
      .pz-cuerpo::-webkit-scrollbar-thumb { background: #d5ecc933; border-radius: 99px; }

      .pz-grupo {
        font-size: calc(var(--u) * 1.6);
        letter-spacing: .16em;
        text-transform: uppercase;
        color: var(--fosforo-flojo);
        padding: calc(var(--u) * 1.2) calc(var(--u) * 0.6) calc(var(--u) * 0.3);
      }

      .pz-fila {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: var(--u);
        width: 100%;
        border: 0;
        cursor: pointer;
        text-align: left;
        background: #d5ecc90a;
        color: inherit;
        font: inherit;
        padding: calc(var(--u) * 1.1) calc(var(--u) * 1.4);
        border-radius: calc(var(--u) * 0.7);
        transition: background .12s;
      }
      .pz-fila:hover, .pz-fila:focus-visible { background: #d5ecc924; outline: none; }
      .pz-fila-nombre { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .pz-fila-apunte { color: var(--fosforo-flojo); font-size: calc(var(--u) * 1.7); white-space: nowrap; }

      .pz-apunte, .pz-resumen { margin: 0 0 calc(var(--u) * 0.6); padding-inline: calc(var(--u) * 0.6); }
      .pz-apunte { color: var(--fosforo-flojo); font-size: calc(var(--u) * 1.8); }
      .pz-notas { margin: 0; padding-left: calc(var(--u) * 3); display: grid; gap: calc(var(--u) * 0.7); }

      .pz-enlace { color: #ffbfa6; padding-inline: calc(var(--u) * 0.6); }

      .pz-regar {
        justify-self: start;
        margin: calc(var(--u) * 1.2) calc(var(--u) * 0.6) 0;
        border: 0;
        cursor: pointer;
        background: var(--coral);
        color: #fff;
        font-family: var(--tipo);
        font-size: calc(var(--u) * 1.8);
        letter-spacing: .1em;
        text-transform: uppercase;
        padding: calc(var(--u) * 1) calc(var(--u) * 2);
        border-radius: 999px;
      }
      .pz-regar:disabled { background: #d5ecc924; color: var(--fosforo-flojo); cursor: default; }
      .pz-aviso { margin: calc(var(--u) * 0.8) calc(var(--u) * 0.6) 0; color: var(--fosforo-flojo); }

      .pz-cert, .pz-estrato {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: var(--u);
        padding: calc(var(--u) * 1) calc(var(--u) * 1.4);
      }
      .pz-cert--pendiente { opacity: .5; }
      .pz-barra {
        flex: 0 0 28%;
        height: calc(var(--u) * 0.9);
        border-radius: 99px;
        background: #d5ecc91f;
        overflow: hidden;
      }
      .pz-barra i { display: block; height: 100%; background: var(--fosforo); opacity: .75; }

      /* consola de texto, plegada por defecto */
      .pz-consola[hidden] { display: none; }
      .pz-consola {
        border-top: 1px solid #d5ecc91f;
        padding: calc(var(--u) * 1.2) calc(var(--u) * 2);
        display: grid;
        gap: calc(var(--u) * 0.6);
      }
      .pz-registro {
        display: grid;
        gap: calc(var(--u) * 0.4);
        max-height: calc(var(--u) * 16);
        overflow-y: auto;
        color: var(--fosforo-flojo);
      }
      .pz-registro p { margin: 0; }
      .pz-eco { color: #ffbfa6; opacity: .75; }
      .pz-linea { display: flex; gap: var(--u); align-items: center; }
      .pz-signo { color: #ffbfa6; }
      .pz-entrada {
        flex: 1;
        border: 0;
        padding: 0;
        background: none;
        color: inherit;
        font: inherit;
      }
      .pz-entrada:focus { outline: none; }
      .pz-entrada::placeholder { color: #d5ecc94d; }

      .pz-pie {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: var(--u);
        padding: calc(var(--u) * 1.2) calc(var(--u) * 2.2);
        border-top: 1px solid #d5ecc91f;
      }
      .pz-atras, .pz-consola-abrir {
        border: 0;
        cursor: pointer;
        background: #d5ecc914;
        color: var(--fosforo);
        font-family: var(--tipo);
        font-size: calc(var(--u) * 1.7);
        letter-spacing: .1em;
        text-transform: uppercase;
        padding: calc(var(--u) * 0.9) calc(var(--u) * 1.8);
        border-radius: 999px;
      }
      .pz-atras[hidden] { visibility: hidden; display: block; }
      .pz-consola-abrir { margin-left: auto; letter-spacing: 0; }
      .pz-consola-abrir.activo { background: var(--coral); color: #fff; }

      /* ─── salir y ajustes ─── */

      #salir {
        position: fixed;
        left: 20px;
        bottom: 20px;
        display: none;
        border: 0;
        cursor: pointer;
        padding: 11px 20px;
        border-radius: 999px;
        background: var(--chapa);
        color: var(--tinta);
        font-family: var(--tipo);
        font-size: 10px;
        letter-spacing: .12em;
        text-transform: uppercase;
        box-shadow: 0 3px 0 var(--surco), 0 8px 20px #00000026;
      }
      #salir.visible { display: block; }

      #abrir-ajustes {
        position: fixed;
        right: 20px;
        bottom: 20px;
        border: 0;
        cursor: pointer;
        padding: 11px 20px;
        border-radius: 999px;
        background: var(--chapa);
        color: var(--tinta);
        font-family: var(--tipo);
        font-size: 10px;
        letter-spacing: .12em;
        text-transform: uppercase;
        box-shadow: 0 3px 0 var(--surco), 0 8px 20px #00000026;
      }
      #ajustes {
        position: fixed;
        right: 20px;
        bottom: 68px;
        display: none;
        gap: 10px;
        padding: 16px;
        border-radius: 12px;
        background: #fffefbf2;
        backdrop-filter: blur(8px);
        box-shadow: 0 8px 28px #0000002b;
        font-size: 10px;
        letter-spacing: .1em;
        text-transform: uppercase;
        color: var(--tinta);
      }
      #ajustes.abierto { display: grid; }
      #mandos { display: grid; gap: 9px; }
      #mandos label {
        display: grid;
        grid-template-columns: 116px 124px 30px;
        align-items: center;
        gap: 10px;
      }
      #mandos output { text-align: right; font-variant-numeric: tabular-nums; }
      #mandos input { width: 100%; }

      @media (max-width: 720px) {
        .chapa { flex-wrap: wrap; }
        .chapa__marca { flex: 1 0 100%; }
        #ajustes { left: 20px; }
        #mandos label { grid-template-columns: 1fr 1fr 28px; }
      }
    </style>
  </head>
  <body>
    <canvas id="lienzo"></canvas>

    <div class="chapa">
      <div class="chapa__marca">
        <div class="chapa__modelo">YTG-01</div>
        <span>consola de cultivo · zaragoza</span>
      </div>
      <div class="chapa__dato"><b id="lectura-hora">--:--</b><span>hora</span></div>
      <div class="chapa__dato"><b id="lectura-temperatura">--º</b><span>exterior</span></div>
      <div class="chapa__dato"><b id="lectura-meteo">—</b><span>cielo</span></div>
      <div class="chapa__dato"><b id="lectura-estacion">—</b><span>estación</span></div>
    </div>

    <div id="pista"></div>

    <div id="visor"><div id="visor-interior"></div></div>

    <button id="salir" type="button">salir · esc</button>

    <button id="abrir-ajustes" type="button">ajustes</button>
    <div id="ajustes"><div id="mandos"></div></div>

    <script type="module" src="/src/prototipo/main.ts"></script>
  </body>
</html>
