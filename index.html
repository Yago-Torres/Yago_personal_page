<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>YTG-01 · prototipo de dirección visual</title>
    <style>
      :root {
        --tipo: ui-monospace, "Cascadia Mono", Menlo, Consolas, monospace;
        --tinta: #3f3a2f;
        color-scheme: light;
      }
      * { box-sizing: border-box; }
      body { margin: 0; overflow: hidden; background: #ffe6c9; font-family: var(--tipo); }
      #lienzo { display: block; width: 100vw; height: 100dvh; }

      .rotulo {
        position: fixed;
        top: 20px;
        left: 24px;
        font-size: 10px;
        letter-spacing: .16em;
        text-transform: uppercase;
        color: var(--tinta);
        pointer-events: none;
      }
      .rotulo b { display: block; font-size: 15px; letter-spacing: -.01em; text-transform: none; }

      /* etiqueta flotante de lo que hay bajo el puntero */
      #pista {
        position: fixed;
        left: 50%;
        bottom: 28px;
        translate: -50% 0;
        padding: 7px 14px;
        border-radius: 999px;
        background: #2a2620e6;
        color: #f6f1e4;
        font-size: 11px;
        letter-spacing: .1em;
        text-transform: uppercase;
        opacity: 0;
        transition: opacity .18s;
        pointer-events: none;
      }
      #pista.visible { opacity: 1; }

      /* ficha que aparece al enfocar la pantalla */
      #ficha {
        position: fixed;
        right: 6vw;
        top: 50%;
        translate: 0 -50%;
        width: min(340px, 40vw);
        display: grid;
        gap: 14px;
        padding: 22px;
        border-radius: 14px;
        background: #141f1af2;
        color: #cfe8c4;
        font-size: 13px;
        line-height: 1.6;
        opacity: 0;
        transition: opacity .3s, translate .3s;
        pointer-events: none;
      }
      #ficha.visible { opacity: 1; pointer-events: auto; }
      #ficha h2 { margin: 0; font-size: 13px; letter-spacing: .12em; text-transform: uppercase; opacity: .6; font-weight: 600; }
      #ficha ul { margin: 0; padding-left: 18px; }
      #ficha .prompt { color: #ff9b7a; }

      .boton {
        justify-self: start;
        border: 0;
        cursor: pointer;
        padding: 8px 16px;
        border-radius: 999px;
        background: #ff6b4a;
        color: #fff;
        font-family: var(--tipo);
        font-size: 10px;
        letter-spacing: .12em;
        text-transform: uppercase;
      }

      /* cajón de ajustes */
      #abrir-ajustes {
        position: fixed;
        right: 20px;
        bottom: 20px;
        border: 0;
        cursor: pointer;
        padding: 10px 18px;
        border-radius: 999px;
        background: #2a2620;
        color: #f6f1e4;
        font-family: var(--tipo);
        font-size: 10px;
        letter-spacing: .12em;
        text-transform: uppercase;
      }
      #ajustes {
        position: fixed;
        right: 20px;
        bottom: 66px;
        display: none;
        gap: 10px;
        padding: 16px;
        border-radius: 12px;
        background: #fffefbe6;
        backdrop-filter: blur(8px);
        box-shadow: 0 8px 28px #0000002b;
        font-size: 10px;
        letter-spacing: .1em;
        text-transform: uppercase;
        color: var(--tinta);
      }
      #ajustes.abierto { display: grid; }
      #mandos { display: grid; gap: 9px; }
      #mandos label {
        display: grid;
        grid-template-columns: 120px 130px 32px;
        align-items: center;
        gap: 10px;
      }
      #mandos output { text-align: right; font-variant-numeric: tabular-nums; }
      #mandos input { width: 100%; }

      @media (max-width: 720px) {
        #ficha { right: 4vw; left: 4vw; width: auto; top: auto; bottom: 90px; translate: 0; }
        #ajustes { left: 20px; }
        #mandos label { grid-template-columns: 1fr 1fr 30px; }
      }
    </style>
  </head>
  <body>
    <canvas id="lienzo"></canvas>

    <div class="rotulo">
      <b>YTG-01</b>
      prototipo · pulsa la pantalla
    </div>

    <div id="pista"></div>

    <div id="ficha">
      <h2>consola de riego</h2>
      <p style="margin:0">
        aquí vivirá el jardín: la pantalla de 1 bit y la línea de comandos.
        de momento esto es una maqueta para ver el movimiento de cámara.
      </p>
      <ul>
        <li>mirar</li>
        <li>regar &lt;planta&gt;</li>
        <li>abrir &lt;planta&gt;</li>
        <li>excavar</li>
      </ul>
      <p style="margin:0"><span class="prompt">&gt;</span> _</p>
      <button class="boton" id="volver" type="button">salir · esc</button>
    </div>

    <button id="abrir-ajustes" type="button">ajustes</button>
    <div id="ajustes"><div id="mandos"></div></div>

    <script type="module" src="/src/prototipo/main.ts"></script>
  </body>
</html>
