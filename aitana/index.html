<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>aitana</title>
    <!-- a este sitio se llega sabiendo la dirección, no buscándolo -->
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#16182a" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Archivo:wght@300;400;500;600&display=swap");

      :root {
        --texto: Archivo, ui-sans-serif, system-ui, -apple-system, "Segoe UI", Helvetica, sans-serif;
        --cifras: ui-monospace, "SF Mono", "Cascadia Mono", Menlo, Consolas, monospace;
        color-scheme: dark;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-content: center;
        justify-items: center;
        gap: 4px;
        padding: 24px;
        background:
          radial-gradient(120% 90% at 50% 8%, #2c2f52 0%, #16182a 55%, #0c0d16 100%);
        color: #efeaf2;
        font-family: var(--texto);
        -webkit-font-smoothing: antialiased;
        overflow-x: hidden;
      }

      h1 {
        margin: 0;
        font-size: clamp(30px, 7vw, 54px);
        font-weight: 300;
        letter-spacing: .01em;
      }

      .apunte {
        margin: 0;
        font-size: 13px;
        letter-spacing: .16em;
        text-transform: uppercase;
        color: #efeaf27a;
      }

      .mundo {
        width: min(460px, 88vw);
        aspect-ratio: 1 / 1;
        margin-block: -10px -18px;
      }
      .mundo canvas { display: block; width: 100%; height: 100%; }

      #pie-mundo {
        margin: 0;
        font-family: var(--cifras);
        font-size: 13px;
        letter-spacing: .1em;
        color: #efeaf2a8;
        min-height: 1.4em;
      }

      .volver {
        margin-top: 22px;
        font-size: 12px;
        letter-spacing: .12em;
        text-transform: uppercase;
        color: #efeaf25c;
        text-decoration: none;
        border-bottom: 1px solid #efeaf229;
        padding-bottom: 2px;
      }
      .volver:hover { color: #efeaf2b8; }
      .volver:focus-visible { outline: 2px solid #efeaf2; outline-offset: 4px; }

      @media (prefers-reduced-motion: reduce) {
        * { animation-duration: .01ms !important; transition-duration: .01ms !important; }
      }
    </style>
  </head>

  <body>
    <p class="apunte">Un sitio pequeño</p>
    <h1>aitana</h1>

    <div class="mundo">
      <canvas id="lienzo" aria-hidden="true"></canvas>
    </div>

    <p id="pie-mundo">Fumándose un piti</p>

    <a class="volver" href="/">Volver al parte</a>

    <script type="module" src="/src/aitana.ts"></script>
  </body>
</html>
