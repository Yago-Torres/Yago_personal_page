<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>YTG-01 · calibración del motor botánico</title>
    <meta name="description" content="Banco de pruebas de las constantes de calibración del jardín. No forma parte del aparato." />
    <link rel="stylesheet" href="/src/style.css" />
    <style>
      /* Banco de pruebas: reutiliza los tokens de style.css, layout propio y plano. */
      body {
        display: block;
        overflow: auto;
        height: auto;
        min-height: 100dvh;
        padding: calc(var(--paso) * 3);
      }
      .banco {
        max-width: 1100px;
        margin: 0 auto;
        display: grid;
        gap: calc(var(--paso) * 3);
      }
      .banco__cabecera h1 {
        font-size: 18px;
        margin: 0 0 4px;
      }
      .banco__cabecera p {
        margin: 0;
        font-size: 12px;
        color: var(--tinta-tenue);
      }
      .controles-cal {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
        gap: calc(var(--paso) * 2);
        background: var(--chasis-alto);
        padding: calc(var(--paso) * 2);
        border-radius: var(--radio);
        box-shadow: inset 0 0 0 1px var(--surco);
      }
      .control-cal {
        display: grid;
        gap: 4px;
      }
      .control-cal label {
        display: flex;
        justify-content: space-between;
        gap: var(--paso);
        font-size: 9px;
        font-weight: 700;
        letter-spacing: .1em;
        text-transform: uppercase;
        color: var(--tinta-tenue);
      }
      .control-cal output {
        font-family: var(--tipo-pantalla);
        font-variant-numeric: tabular-nums;
        color: var(--tinta);
      }
      .control-cal input[type="range"] {
        width: 100%;
        accent-color: var(--azul);
      }
      .tarjetas {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
        gap: calc(var(--paso) * 2);
      }
      .tarjeta {
        display: grid;
        gap: calc(var(--paso) / 2);
        background: var(--chasis-alto);
        padding: var(--paso);
        border-radius: var(--radio);
        box-shadow: inset 0 0 0 1px var(--surco);
      }
      .tarjeta__lienzo {
        width: 100%;
        aspect-ratio: 16 / 9;
        background: var(--pantalla);
        border-radius: calc(var(--radio) / 2);
        image-rendering: pixelated;
      }
    </style>
  </head>
  <body>
    <div class="banco">
      <header class="banco__cabecera">
        <h1>calibración del motor botánico</h1>
        <p>banco de pruebas — no forma parte del aparato. ajusta y compara especies de ejemplo.</p>
      </header>

      <div class="controles-cal">
        <div class="control-cal">
          <label for="vigor">vigor <output for="vigor">0.6</output></label>
          <input id="vigor" type="range" min="0" max="1" step="0.05" value="0.6" />
        </div>
        <div class="control-cal">
          <label for="iteraciones">iteraciones <output for="iteraciones">4</output></label>
          <input id="iteraciones" type="range" min="2" max="6" step="1" value="4" />
        </div>
        <div class="control-cal">
          <label for="angulo">ángulo <output for="angulo">26</output></label>
          <input id="angulo" type="range" min="5" max="60" step="1" value="26" />
        </div>
        <div class="control-cal">
          <label for="decaimiento">decaimiento <output for="decaimiento">0.68</output></label>
          <input id="decaimiento" type="range" min="0.4" max="0.9" step="0.01" value="0.68" />
        </div>
        <div class="control-cal">
          <label for="umbral">umbral de desborde <output for="umbral">0.62</output></label>
          <input id="umbral" type="range" min="0" max="1" step="0.02" value="0.62" />
        </div>
        <div class="control-cal">
          <label for="ancho">resolución — ancho <output for="ancho">480</output></label>
          <input id="ancho" type="range" min="120" max="960" step="20" value="480" />
        </div>
        <div class="control-cal">
          <label for="alto">resolución — alto <output for="alto">270</output></label>
          <input id="alto" type="range" min="68" max="540" step="10" value="270" />
        </div>
        <div class="control-cal">
          <label for="densidad">densidad del tramado <output for="densidad">0.5</output></label>
          <input id="densidad" type="range" min="0" max="1" step="0.02" value="0.5" />
        </div>
      </div>

      <div class="tarjetas" id="tarjetas"></div>
    </div>

    <script type="module" src="/src/calibracion.ts"></script>
  </body>
</html>
